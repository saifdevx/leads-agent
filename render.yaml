services:
  - type: web
    runtime: static
    name: lead-platform-web
    rootDir: frontend
    buildCommand: npm install --include=optional --no-audit --no-fund && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false

  - type: web
    runtime: python
    name: lead-platform-api
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 0.10.0
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TURSO_TIMEOUT_SECONDS
        value: 15
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_APP_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: GMAIL_OAUTH_CLIENT_ID
        sync: false
      - key: GMAIL_OAUTH_CLIENT_SECRET
        sync: false
      - key: GMAIL_OAUTH_REDIRECT_URI
        sync: false

# Production email sending requires an always-on worker process.
# Add a Render Background Worker using backend as rootDir and:
#   startCommand: python -m app.outreach.worker
# Configure the same backend secrets plus the Gmail OAuth variables below.
