services:
  - type: web
    runtime: static
    name: lead-gen-web
    rootDir: frontend
    buildCommand: npm install --include=optional --no-audit --no-fund && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false

  - type: web
    runtime: python
    name: lead-gen-api
    rootDir: backend
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m app.db.migrate
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 1.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: BACKGROUND_JOBS_MODE
        value: worker
      - key: WORKER_POLL_SECONDS
        value: 3
      - key: WORKER_LEASE_SECONDS
        value: 300
      - key: USER_ACCESS_CACHE_SECONDS
        value: 60
      - key: QUICK_SEND_PER_MINUTE
        value: 6
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_APP_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TURSO_TIMEOUT_SECONDS
        value: 15
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: GMAIL_OAUTH_CLIENT_ID
        sync: false
      - key: GMAIL_OAUTH_CLIENT_SECRET
        sync: false
      - key: GMAIL_OAUTH_REDIRECT_URI
        sync: false

  - type: worker
    runtime: python
    name: lead-gen-lead-worker
    rootDir: backend
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.worker
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 1.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: WORKER_POLL_SECONDS
        value: 3
      - key: WORKER_LEASE_SECONDS
        value: 300
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TURSO_TIMEOUT_SECONDS
        value: 15
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false

  - type: worker
    runtime: python
    name: lead-gen-outreach-worker
    rootDir: backend
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.outreach.worker
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 1.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TURSO_TIMEOUT_SECONDS
        value: 15
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: GMAIL_OAUTH_CLIENT_ID
        sync: false
      - key: GMAIL_OAUTH_CLIENT_SECRET
        sync: false
