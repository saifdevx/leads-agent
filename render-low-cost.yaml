# Lower-cost production option for early personal use.
# Uses the API process for discovery/enrichment background tasks and keeps only
# the outreach worker separate so scheduled email sending remains reliable.
# Upgrade to render.yaml when you want durable discovery/enrichment jobs that
# survive API restarts/deploys independently.

services:
  - type: web
    runtime: static
    name: lead-platform-web
    rootDir: frontend
    buildCommand: npm install --include=optional --no-audit --no-fund && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false

  - type: web
    runtime: python
    name: lead-platform-api
    rootDir: backend
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m app.db.migrate
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 0.11.0
      - key: LOG_LEVEL
        value: INFO
      - key: BACKGROUND_JOBS_MODE
        value: inline
      - key: USER_ACCESS_CACHE_SECONDS
        value: 30
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_APP_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TURSO_TIMEOUT_SECONDS
        value: 15
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: GMAIL_OAUTH_CLIENT_ID
        sync: false
      - key: GMAIL_OAUTH_CLIENT_SECRET
        sync: false
      - key: GMAIL_OAUTH_REDIRECT_URI
        sync: false

  - type: worker
    runtime: python
    name: lead-platform-outreach-worker
    rootDir: backend
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.outreach.worker
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 0.11.0
      - key: LOG_LEVEL
        value: INFO
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TURSO_TIMEOUT_SECONDS
        value: 15
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: GMAIL_OAUTH_CLIENT_ID
        sync: false
      - key: GMAIL_OAUTH_CLIENT_SECRET
        sync: false
